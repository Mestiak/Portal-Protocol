name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: portal-protocol-windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: portal-protocol-macos-aarch64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: portal-protocol-linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Download EI parser binaries
        run: node scripts/download_ei.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: true
        with:
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: portal-protocol-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-binaries
          for dir in portal-protocol-artifacts/*/; do
            [ -d "$dir" ] && find "$dir" -type f -exec cp {} release-binaries/ \;
          done
          rm -f release-binaries/latest.json
          echo "=== Flattened files ==="
          ls -la release-binaries/

      - name: Generate latest.json
        run: |
          WIN_SIG=$(find release-binaries/ -name "*.exe.sig" -print -quit | xargs cat | tr -d '\n')
          MAC_SIG=$(find release-binaries/ -name "*.dmg.sig" -print -quit | xargs cat | tr -d '\n')
          LINUX_SIG=$(find release-binaries/ -name "*.AppImage.sig" -print -quit | xargs cat | tr -d '\n')

          WIN_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${{ github.ref_name }}_x64-setup.exe"
          MAC_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${{ github.ref_name }}_aarch64.dmg"
          LINUX_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${{ github.ref_name }}_amd64.AppImage"

          cat > latest.json << EOF
          {
            "version": "$(echo ${{ github.ref_name }} | sed 's/^v//')",
            "notes": "Portal Protocol ${{ github.ref_name }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$WIN_URL"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$MAC_URL"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$LINUX_URL"
              }
            }
          }
          EOF

          echo "=== latest.json ==="
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Portal Protocol ${{ github.ref_name }}
          draft: true
          body_path: RELEASE-NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary assets
        run: |
          gh release upload ${{ github.ref_name }} release-binaries/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.json
        run: |
          gh release upload ${{ github.ref_name }} latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
