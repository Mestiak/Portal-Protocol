name: Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Download EI parser binaries
        run: node scripts/download_ei.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build Tauri app
        run: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: true

      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts

      - name: Purge existing release assets
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          echo "=== Purging existing assets for $TAG ==="
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          if [ -n "$ASSETS" ]; then
            echo "$ASSETS" | while read -r asset; do
              echo "  Deleting: $asset"
              gh release delete-asset "$TAG" "$asset" 2>/dev/null || true
            done
            echo "  Purge complete"
          else
            echo "  No existing release to purge"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or verify release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          echo "=== Checking for existing release: $TAG ==="
          if gh release view "$TAG" --json id > /dev/null 2>&1; then
            echo "=== Release already exists ==="
          else
            echo "=== Creating draft release ==="
            gh release create "$TAG" --draft \
              --title "Portal Protocol $TAG" \
              --notes-file RELEASE-NOTES.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bundle assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          echo "=== Uploading all bundle files ==="
          echo "=== All files in build-artifacts/ ==="
          find build-artifacts -type f | sort
          echo "=== Total files: $(find build-artifacts -type f | wc -l) ==="
          echo ""
          echo "=== Bundle files (by extension) ==="
          find build-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.exe.sig" -o \
            -name "*.msi" -o \
            -name "*.msi.sig" -o \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" -o \
            -name "*.AppImage" -o \
            -name "*.AppImage.sig" -o \
            -name "*.deb" -o \
            -name "*.deb.sig" -o \
            -name "*.rpm" -o \
            -name "*.rpm.sig" \
          \) | sort
          BUNDLE_COUNT=$(find build-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.exe.sig" -o \
            -name "*.msi" -o \
            -name "*.msi.sig" -o \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" -o \
            -name "*.AppImage" -o \
            -name "*.AppImage.sig" -o \
            -name "*.deb" -o \
            -name "*.deb.sig" -o \
            -name "*.rpm" -o \
            -name "*.rpm.sig" \
          \) | wc -l)
          echo "=== Bundle files: $BUNDLE_COUNT ==="
          echo ""
          if [ "$BUNDLE_COUNT" -eq 0 ]; then
            echo "ERROR: No bundle files found!"
            exit 1
          fi
          FAILED=0
          while IFS= read -r -d '' file; do
            FILENAME=$(basename "$file")
            SIZE=$(wc -c < "$file")
            echo "Uploading: ${FILENAME} (${SIZE} bytes)"
            if gh release upload "$TAG" "$file" --clobber 2>&1; then
              echo "  SUCCESS"
            else
              echo "  FAILED"
              FAILED=$((FAILED + 1))
            fi
          done < <(find build-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.exe.sig" -o \
            -name "*.msi" -o \
            -name "*.msi.sig" -o \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" -o \
            -name "*.AppImage" -o \
            -name "*.AppImage.sig" -o \
            -name "*.deb" -o \
            -name "*.deb.sig" -o \
            -name "*.rpm" -o \
            -name "*.rpm.sig" \
          \) -print0)
          echo "=== Upload complete: ${FAILED} failed ==="
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED uploads failed!"
            exit 1
          fi
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          mkdir -p sigs
          find build-artifacts -type f -name "*.sig" | sort | while IFS= read -r sigfile; do
            cp "$sigfile" "sigs/$(basename "$sigfile")"
          done
          echo "=== Sig files ==="
          ls -la sigs/

          WIN_SIG=$(cat sigs/*Setup.exe.sig 2>/dev/null | tr -d '\n' || echo "")
          MSI_SIG=$(cat sigs/*x64_en-US.msi.sig 2>/dev/null | tr -d '\n' || echo "")
          MAC_SIG=$(cat sigs/*.app.tar.gz.sig 2>/dev/null | tr -d '\n' || echo "")
          LINUX_SIG=$(cat sigs/*.AppImage.sig 2>/dev/null | tr -d '\n' || echo "")
          DEB_SIG=$(cat sigs/*.deb.sig 2>/dev/null | tr -d '\n' || echo "")
          RPM_SIG=$(cat sigs/*.rpm.sig 2>/dev/null | tr -d '\n' || echo "")

          WIN_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${VERSION}_x64-setup.exe"
          MSI_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${VERSION}_x64_en-US.msi"
          MAC_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${VERSION}_aarch64.dmg"
          LINUX_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${VERSION}_amd64.AppImage"
          DEB_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${VERSION}_amd64.deb"
          RPM_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol-${VERSION}-1.x86_64.rpm"

          cat > latest.json << HEREDOC
          {
            "version": "$VERSION",
            "notes": "Portal Protocol ${{ github.ref_name }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$WIN_URL"
              },
              "windows-x86_64-msi": {
                "signature": "$MSI_SIG",
                "url": "$MSI_URL"
              },
              "windows-x86_64-nsis": {
                "signature": "$WIN_SIG",
                "url": "$WIN_URL"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$MAC_URL"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$LINUX_URL"
              },
              "linux-x86_64-deb": {
                "signature": "$DEB_SIG",
                "url": "$DEB_URL"
              },
              "linux-x86_64-rpm": {
                "signature": "$RPM_SIG",
                "url": "$RPM_URL"
              }
            }
          }
          HEREDOC

          echo "=== latest.json ==="
          cat latest.json
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Upload latest.json to release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          echo "=== Uploading latest.json ==="
          gh release upload "$TAG" latest.json --clobber
          echo "=== Latest.json uploaded ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
