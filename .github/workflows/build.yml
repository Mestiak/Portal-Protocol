name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Draft Release
        run: |
          # JSON-encode RELEASE-NOTES.md
          BODY=$(jq -Rs . < RELEASE-NOTES.md)
          PAYLOAD=$(jq -n \
            --arg tag "${TAG_NAME}" \
            --arg name "Portal Protocol ${TAG_NAME}" \
            --argjson body "$BODY" \
            '{tag_name: $tag, name: $name, draft: true, body: $body}')

          echo "=== Creating release for tag: ${TAG_NAME} ==="
          echo "Payload:"
          echo "$PAYLOAD" | python3 -m json.tool

          HTTP_RESPONSE=$(curl -sSL -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Mestiak/Portal-Protocol/releases" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)

          echo "=== HTTP Status: ${HTTP_CODE} ==="
          echo "=== Response: ==="
          echo "$RESPONSE_BODY" | python3 -m json.tool

          if [ "$HTTP_CODE" != "201" ]; then
            echo "FAILED to create release"
            exit 1
          fi

          echo "=== Release created successfully ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

  build:
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Download EI parser binaries
        run: node scripts/download_ei.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: true
        with:
          args: --target ${{ matrix.target }}

      - name: Upload bundle to release
        shell: bash
        run: |
          echo "=== Bundle files ==="
          find src-tauri/target/release/bundle -type f | sort
          echo "=== Uploading to release ==="
          find src-tauri/target/release/bundle -type f -print0 | xargs -0 gh release upload ${{ github.ref_name }} --clobber --repo Mestiak/Portal-Protocol
          echo "=== Upload complete ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download signatures from release
        run: |
          mkdir -p sigs
          gh release download ${{ github.ref_name }} --pattern "*.sig" --dir sigs --repo Mestiak/Portal-Protocol
          echo "=== Downloaded signatures ==="
          ls -la sigs/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          WIN_SIG=$(find sigs/ -name "*.exe.sig" -print -quit | xargs cat | tr -d '\n')
          MAC_SIG=$(find sigs/ -name "*.dmg.sig" -print -quit | xargs cat | tr -d '\n')
          LINUX_SIG=$(find sigs/ -name "*.AppImage.sig" -print -quit | xargs cat | tr -d '\n')

          WIN_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${VERSION}_x64-setup.exe"
          MAC_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${VERSION}_aarch64.dmg"
          LINUX_URL="https://github.com/Mestiak/Portal-Protocol/releases/download/${{ github.ref_name }}/Portal.Protocol_${VERSION}_amd64.AppImage"

          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "Portal Protocol ${{ github.ref_name }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$WIN_URL"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$MAC_URL"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$LINUX_URL"
              }
            }
          }
          EOF

          echo "=== latest.json ==="
          cat latest.json

      - name: Upload latest.json to release
        run: |
          gh release upload ${{ github.ref_name }} latest.json --clobber --repo Mestiak/Portal-Protocol
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
