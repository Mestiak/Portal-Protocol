# Portal Protocol - minimal EI config: JSON out only, no HTML, no CSV
SaveOutHTML=false
SaveOutCSV=false
SaveOutJSON=true
IndentJSON=false
SaveOutTrace=false
# Required so Cerus "Shadows Reached Boss" detection can read Malicious Shadow
# spawn positions (combatReplayData). Without this EI omits positions, so the
# parser can never prove a shadow spawned near Cerus and silently mislabels the
# Emp.A cluster as an Orb (+stacks). Slows EI slightly; JSON grows modestly.
ParseCombatReplay=true
