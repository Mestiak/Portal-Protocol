[package]
name = "gw2-log-uploader"
version = "0.7.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "gw2-log-uploader"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gw2_log_uploader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2.12.0", features = ["native-tls"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5.0.1"
notify = "6.1.1"
chrono = { version = "0.4", features = ["serde"] }
zip = "2"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "gzip"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
flate2 = "1"
